<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Ottoman Gold Gradient -->
    <linearGradient id="ottomanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Classical Turquoise/Iznik Tile Gradient for Mosque -->
    <linearGradient id="mosqueDomeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <linearGradient id="minaretGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crescentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bgSky)" stroke="#334155" stroke-width="2" />

  <!-- Stars in Night Sky -->
  <circle cx="28" cy="28" r="1.2" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="42" cy="18" r="1.8" fill="#FCD34D" opacity="0.7"/>
  <circle cx="88" cy="22" r="1.2" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="102" cy="38" r="1.4" fill="#FCD34D" opacity="0.8"/>
  <circle cx="20" cy="52" r="1.2" fill="#F8FAFC" opacity="0.4"/>

  <!-- Ottoman Crescent (Hilal) -->
  <path d="M 64 16 A 26 26 0 1 0 88 64 A 20 20 0 1 1 64 16 Z" 
        fill="url(#ottomanGold)" filter="url(#crescentGlow)" opacity="0.95"/>
  <!-- Eight-pointed Ottoman / Seljuk Star -->
  <polygon points="80,30 83,35 88,32 86,37 91,40 86,43 88,48 83,45 80,50 77,45 72,48 74,43 69,40 74,37 72,32 77,35" 
           fill="url(#ottomanGold)" opacity="0.85" />

  <!-- ==================== OTTOMAN MOSQUE (MİMAR SİNAN SİLÜETİ) ==================== -->
  
  <!-- Minaret 1 (Far Left - Outer) -->
  <g id="minaret_outer_left">
    <!-- Body -->
    <rect x="18" y="42" width="3.5" height="68" fill="url(#minaretGrad)" />
    <!-- Balcony 1 (Şerefe) -->
    <rect x="16.5" y="60" width="6.5" height="3" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Balcony 2 (Şerefe) -->
    <rect x="16.5" y="48" width="6.5" height="3" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Conical Spire (Kurşun Külah) -->
    <polygon points="17.5,42 19.75,26 22,42" fill="#34D399" />
    <!-- Crescent Finial (Hilal Alem) -->
    <line x1="19.75" y1="26" x2="19.75" y2="22" stroke="#F59E0B" stroke-width="1" />
    <circle cx="19.75" cy="21.5" r="1.2" fill="#F59E0B" />
  </g>

  <!-- Minaret 2 (Inner Left) -->
  <g id="minaret_inner_left">
    <rect x="30" y="36" width="4" height="74" fill="url(#minaretGrad)" />
    <!-- Balcony 1 -->
    <rect x="28" y="58" width="8" height="3.5" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Balcony 2 -->
    <rect x="28" y="44" width="8" height="3.5" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Conical Spire (Külah) -->
    <polygon points="29.5,36 32,18 34.5,36" fill="#34D399" />
    <!-- Alem -->
    <line x1="32" y1="18" x2="32" y2="13" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="32" cy="12.5" r="1.5" fill="#F59E0B" />
  </g>

  <!-- Minaret 3 (Inner Right) -->
  <g id="minaret_inner_right">
    <rect x="94" y="36" width="4" height="74" fill="url(#minaretGrad)" />
    <!-- Balcony 1 -->
    <rect x="92" y="58" width="8" height="3.5" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Balcony 2 -->
    <rect x="92" y="44" width="8" height="3.5" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Conical Spire (Külah) -->
    <polygon points="93.5,36 96,18 98.5,36" fill="#34D399" />
    <!-- Alem -->
    <line x1="96" y1="18" x2="96" y2="13" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="96" cy="12.5" r="1.5" fill="#F59E0B" />
  </g>

  <!-- Minaret 4 (Far Right - Outer) -->
  <g id="minaret_outer_right">
    <rect x="106" y="42" width="3.5" height="68" fill="url(#minaretGrad)" />
    <!-- Balcony 1 -->
    <rect x="104.5" y="60" width="6.5" height="3" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Balcony 2 -->
    <rect x="104.5" y="48" width="6.5" height="3" rx="0.5" fill="url(#ottomanGold)" />
    <!-- Conical Spire -->
    <polygon points="105.5,42 107.75,26 110,42" fill="#34D399" />
    <!-- Alem -->
    <line x1="107.75" y1="26" x2="107.75" y2="22" stroke="#F59E0B" stroke-width="1" />
    <circle cx="107.75" cy="21.5" r="1.2" fill="#F59E0B" />
  </g>

  <!-- Cascading Domes of Classical Ottoman Architecture (Süleymaniye / Selimiye Hierarchical Cascade) -->
  <!-- Layer 1: Buttresses & Outer semi-domes -->
  <path d="M 28 110 L 28 88 Q 36 82 44 88 L 44 110 Z" fill="#047857" />
  <path d="M 84 110 L 84 88 Q 92 82 100 88 L 100 110 Z" fill="#047857" />
  
  <!-- Outer Semi-domes (Yarım Kubbeler) -->
  <path d="M 32 90 Q 42 74 52 86 Z" fill="url(#mosqueDomeGrad)" />
  <path d="M 76 86 Q 86 74 96 90 Z" fill="url(#mosqueDomeGrad)" />

  <!-- Layer 2: Main Side Semi-Domes (Büyük Yarım Kubbeler) -->
  <path d="M 38 86 Q 50 64 64 72 Z" fill="#059669" />
  <path d="M 64 72 Q 78 64 90 86 Z" fill="#047857" />

  <!-- Layer 3: Grand Central Ottoman Dome (Ana Kubbe) -->
  <path d="M 44 76 C 44 50 84 50 84 76 Z" fill="url(#mosqueDomeGrad)" />
  <!-- Dome Drum with Arch Windows (Kasnak ve Pencereler) -->
  <rect x="44" y="74" width="40" height="7" fill="#064E3B" />
  <circle cx="50" cy="77" r="1.2" fill="#FDE68A" />
  <circle cx="57" cy="77" r="1.2" fill="#FDE68A" />
  <circle cx="64" cy="77" r="1.2" fill="#FDE68A" />
  <circle cx="71" cy="77" r="1.2" fill="#FDE68A" />
  <circle cx="78" cy="77" r="1.2" fill="#FDE68A" />

  <!-- Central Dome Alem (Altın Hilal Alem) -->
  <line x1="64" y1="52" x2="64" y2="44" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="64" cy="43" r="2.2" fill="#FDE68A" />
  <!-- Tiny Crescent on Alem -->
  <path d="M 63.5 41 A 2.5 2.5 0 1 0 66 45 A 2 2 0 1 1 63.5 41 Z" fill="#F59E0B" />

  <!-- Base Structure / Courtyard Portico (Son Cemaat ve Kemerler) -->
  <rect x="22" y="90" width="84" height="20" fill="#047857" />
  <!-- Portico arches (Sivri Osmanlı kemerleri) -->
  <path d="M 32 110 L 32 100 Q 36 96 40 100 L 40 110 Z" fill="#090D16" />
  <path d="M 44 110 L 44 99 Q 49 94 54 99 L 54 110 Z" fill="#090D16" />
  <!-- Grand Portal / Taç Kapı -->
  <path d="M 58 110 L 58 97 Q 64 91 70 97 L 70 110 Z" fill="#090D16" />
  <path d="M 74 110 L 74 99 Q 79 94 84 99 L 84 110 Z" fill="#090D16" />
  <path d="M 88 110 L 88 100 Q 92 96 96 100 L 96 110 Z" fill="#090D16" />

  <!-- Base Foundation Line -->
  <line x1="14" y1="110" x2="114" y2="110" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
</svg>
