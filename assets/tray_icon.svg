<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trayOttomanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- High-contrast Ottoman Mosque Silhouette for Linux/KDE System Tray -->
  <!-- Left Pencil Minaret (Osmanlı Kalem Minare) -->
  <rect x="12" y="18" width="2.5" height="40" fill="#F8FAFC" />
  <rect x="10.5" y="29" width="5.5" height="2" rx="0.5" fill="url(#trayOttomanGold)" />
  <polygon points="12,18 13.25,9 14.5,18" fill="#F8FAFC" />
  <line x1="13.25" y1="9" x2="13.25" y2="6.5" stroke="url(#trayOttomanGold)" stroke-width="1" />

  <!-- Right Pencil Minaret -->
  <rect x="49.5" y="18" width="2.5" height="40" fill="#F8FAFC" />
  <rect x="48" y="29" width="5.5" height="2" rx="0.5" fill="url(#trayOttomanGold)" />
  <polygon points="49.5,18 50.75,9 52,18" fill="#F8FAFC" />
  <line x1="50.75" y1="9" x2="50.75" y2="6.5" stroke="url(#trayOttomanGold)" stroke-width="1" />

  <!-- Cascading Semi-Domes (Yarım Kubbeler) -->
  <path d="M 16 48 Q 24 38 32 44 Z" fill="#10B981" />
  <path d="M 32 44 Q 40 38 48 48 Z" fill="#10B981" />

  <!-- Grand Central Ottoman Dome (Ana Kubbe) -->
  <path d="M 21 44 C 21 26 43 26 43 44 Z" fill="#10B981" />
  
  <!-- Central Dome Alem (Altın Hilal Alem) -->
  <line x1="32" y1="28" x2="32" y2="21" stroke="url(#trayOttomanGold)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="32" cy="20" r="1.5" fill="url(#trayOttomanGold)" />

  <!-- Base and Portico -->
  <rect x="12" y="48" width="40" height="10" rx="1" fill="#059669" />
  <!-- Portal Arch -->
  <path d="M 29 58 L 29 52 Q 32 49 35 52 L 35 58 Z" fill="#0F172A" />

  <!-- Crescent in Sky -->
  <path d="M 34 5 A 10 10 0 1 0 44 21 A 8 8 0 1 1 34 5 Z" fill="url(#trayOttomanGold)" opacity="0.9" />
</svg>
